dependencies {
    implementation 'net.sf.jchart2d:jchart2d:3.3.2'

    // To avoid conflict with core to force use of apache.commons.io 2.8 and not 1.3.1 that the prev xml-graphics depends of
    // This is a dependency jchart2d has, but we need to force it to use the newer version of apache.commons.io
    implementation('org.apache.xmlgraphics:xmlgraphics-commons') {
        version {
            strictly '2.12'
        }
    }
}

